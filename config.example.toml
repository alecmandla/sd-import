# sd-photo-import configuration
#
# Copy this file to ~/.config/sd-photo-import/config.toml (install.sh does
# this for you) and edit to taste. Any keys you omit fall back to the
# defaults below.

[paths]
# Where imported photos go. Year and month folders are created inside this.
# Tip: point this at a cloud-synced folder (Google Drive, iCloud Drive,
# Dropbox) and you get automatic offsite backup.
destination = "~/Pictures"

# Optional. If the destination is on a drive that isn't mounted when a card
# goes in, photos land here instead and are moved into the destination
# (same YYYY/Month layout) the next time it mounts. Leave empty to disable.
fallback_destination = ""

# Copy mode only: record of files already imported, so a card that still
# holds old photos doesn't re-import them.
ledger = "~/.local/state/sd-import/imported.tsv"

[behavior]
# "move" removes photos from the card after import. "copy" leaves them on
# the card (format the card in-camera when you're ready).
mode = "move"

# Move photos staged in fallback_destination into destination automatically
# the next time it mounts. Turn off if you edit photos in the fallback folder
# (e.g. in a photo library app that tracks file paths) and want to move them
# yourself.
drain_fallback = true

# Eject the SD card after a successful import.
eject_when_done = true

# Month folder name. Available placeholders:
#   {month_num}    -> 5
#   {month_num:02d}-> 05
#   {month_name}   -> May
#   {year}         -> 2026
# Examples: "{month_num:02d}-{month_name}" -> "05-May"
#           "{month_num:02d}"              -> "05"
#           "{year}-{month_num:02d}"       -> "2026-05"
month_folder_format = "{month_num:02d}-{month_name}"

# Subfolder inside each month folder for RAW files. Set to "" to keep RAW
# files alongside JPEGs.
raw_subfolder = "RAW"

[filetypes]
jpeg  = [".jpg", ".jpeg"]
raw   = [".cr2", ".cr3", ".nef", ".arw", ".raf", ".rw2", ".orf", ".dng", ".pef", ".srw"]
video = [".mp4", ".mov", ".avi", ".m4v"]
